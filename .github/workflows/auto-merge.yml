name: Auto-Merge PRs

on:
  pull_request:
    types:
      - labeled
      - synchronize
  check_suite:
    types:
      - completed

jobs:
  auto-merge:
    name: Auto-Merge when CI Passes
    runs-on: ubuntu-latest

    # 只在有 auto-merge label 时运行
    if: contains(github.event.pull_request.labels.*.name, 'auto-merge')

    steps:
      - name: Wait for CI checks
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.ref }}
          check-names: 'Web - ESLint & Type Check, Web - Unit Tests, AI Service - Pyright & Ruff'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

      - name: Enable auto-merge
        run: |
          gh pr merge --auto --squash "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Comment on merge
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ PR will be automatically merged when all checks pass!'
            })
