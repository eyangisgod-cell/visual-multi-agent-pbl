name: CI/CD Pipeline (Optimized)

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  schedule:
    # 每天凌晨 2 点运行完整检查（不阻止合并）
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================
  # Detect Changed Files
  # =========================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      backend: ${{ steps.filter.outputs.backend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
            backend:
              - 'apps/ai-service/**'
            shared:
              - '.github/**'
              - 'docker/**'
              - 'package*.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  # =========================================
  # Fast Check (Feature Branches - Required)
  # =========================================
  web-typecheck:
    name: Web - TypeScript Check
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # 只检查修改的文件（快速）
      - name: TypeScript check (modified files)
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- '*.ts' '*.tsx' | xargs -r npx tsc --noEmit || true
          else
            # PR: 检查所有文件确保兼容性
            npx tsc --noEmit
          fi

  web-lint:
    name: Web - ESLint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # 只检查修改的文件（快速）
      - name: ESLint (modified files)
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- '*.ts' '*.tsx' | xargs -r npx eslint || true
          else
            # PR: 检查所有文件
            npm run lint
          fi

  # =========================================
  # Standard Check (Core Files - Required for PR)
  # =========================================
  web-test:
    name: Web - Unit Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, web-typecheck]
    if: needs.detect-changes.outputs.shared == 'true' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test -- --passWithNoTests --coverage

  # =========================================
  # Full Check (Main Branch Only / Nightly)
  # =========================================
  web-e2e:
    name: Web - E2E Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, web-test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    continue-on-error: true  # E2E 失败不阻止合并
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/web/playwright-report/
          retention-days: 7

  # =========================================
  # Backend Checks
  # =========================================
  ai-service-lint:
    name: AI Service - Ruff
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.shared == 'true'
    defaults:
      run:
        working-directory: apps/ai-service

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/ai-service/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff check
        run: ruff check . || true  # 只警告

  ai-service-test:
    name: AI Service - Pytest
    runs-on: ubuntu-latest
    needs: [detect-changes, ai-service-lint]
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    defaults:
      run:
        working-directory: apps/ai-service

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pbl_platform_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/ai-service/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pbl_platform_test
          REDIS_URL: redis://localhost:6379
        run: pytest --cov=app --cov-report=xml || true  # 只警告

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/ai-service/coverage.xml
          flags: ai-service
          fail_ci_if_error: false

  # =========================================
  # PR Gate - Fast (Feature Branches)
  # =========================================
  pr-check-fast:
    name: ✅ PR Check (Fast)
    runs-on: ubuntu-latest
    needs: [web-typecheck, web-lint]
    if: github.ref != 'refs/heads/main'

    steps:
      - name: Fast check passed
        run: |
          echo "✅ Fast check passed!"
          echo "Feature branch ready for merge to main"

  # =========================================
  # PR Gate - Full (Main Branch)
  # =========================================
  pr-check-full:
    name: ✅ PR Check (Full)
    runs-on: ubuntu-latest
    needs: [web-typecheck, web-lint, web-test]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Full check passed
        run: |
          echo "✅ Full check passed!"
          echo "Ready for production deployment"

  # =========================================
  # Nightly Full Check (Scheduled)
  # =========================================
  nightly-full-check:
    name: 🌙 Nightly Full Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: [web-e2e, ai-service-test]

    steps:
      - name: Nightly check complete
        run: |
          echo "🌙 Nightly full check complete!"
          echo "Check individual job results for details"
